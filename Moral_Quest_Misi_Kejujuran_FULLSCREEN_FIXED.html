<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moral Quest — Misi Kejujuran Camera Quest</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  background:
    radial-gradient(circle at 10% 15%,#ffcf70 0 10%,transparent 28%),
    radial-gradient(circle at 90% 12%,#67e8f9 0 9%,transparent 27%),
    radial-gradient(circle at 80% 90%,#c4b5fd 0 12%,transparent 30%),
    linear-gradient(135deg,#4f46e5,#7c3aed 42%,#0891b2);
  color:#172554;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background-image:
    radial-gradient(circle,#ffffff55 1px,transparent 1.5px),
    radial-gradient(circle,#ffffff33 1px,transparent 1.5px);
  background-size:28px 28px,43px 43px;
  background-position:0 0,13px 9px;
}
.max-w-5xl{max-width:none!important}
body>.max-w-5xl{width:100vw;height:100vh;padding:0!important;margin:0!important}
.glass{
  background:#ffffffed;
  backdrop-filter:blur(14px);
  box-shadow:0 18px 45px #11182745;
}
#app{width:100%;height:100%}

/* TV-style top bar */
.tv-header{
  height:92px;padding:12px 22px;
  display:flex;align-items:center;justify-content:space-between;
  gap:18px;color:white;
  background:linear-gradient(90deg,#312e81,#4338ca,#7c3aed);
  border-bottom:5px solid #fbbf24;
  box-shadow:0 8px 25px #11182755;
}
.tv-brand{display:flex;align-items:center;gap:12px}
.tv-logo{
  width:58px;height:58px;border-radius:18px;
  display:grid;place-items:center;font-size:32px;
  background:linear-gradient(135deg,#facc15,#fb923c);
  box-shadow:0 5px 15px #0004;
}
.tv-title{font-weight:1000;font-size:clamp(22px,3vw,34px);line-height:1}
.tv-sub{font-size:13px;font-weight:800;opacity:.9;margin-top:5px}
.tv-stats{display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end}
.tv-stat{
  padding:10px 15px;border-radius:16px;background:#ffffff22;
  border:2px solid #ffffff33;font-weight:900;white-space:nowrap;
}

/* Full screen home */
.home-screen{
  width:100%;height:100%;min-height:100vh;
  display:flex;flex-direction:column;
}
.home-main{
  flex:1;display:flex;align-items:center;justify-content:center;
  padding:25px;
}
.home-card{
  width:min(1050px,94vw);text-align:center;color:#172554;
  border-radius:35px;padding:35px;
  background:#ffffffef;box-shadow:0 25px 60px #11182755;
}
.hero-badge{
  display:inline-block;padding:8px 16px;border-radius:999px;
  background:#fef3c7;color:#92400e;font-weight:900;font-size:13px;
}
.hero-icon{font-size:clamp(65px,9vw,100px);filter:drop-shadow(0 10px 8px #0002)}
.hero-title{
  font-size:clamp(42px,7vw,78px);line-height:.95;margin:8px 0;
  font-weight:1000;
  background:linear-gradient(90deg,#4f46e5,#7c3aed,#0891b2);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero-sub{font-size:clamp(15px,2vw,21px);font-weight:700;color:#64748b}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:850px;margin:28px auto 0}
.mode-btn{
  border:0;border-radius:27px;padding:25px;cursor:pointer;text-align:left;
  color:white;box-shadow:0 12px 25px #11182730;transition:.18s;
}
.mode-btn:hover{transform:translateY(-5px) scale(1.01)}
.mode-touch{background:linear-gradient(135deg,#2563eb,#4f46e5)}
.mode-camera{background:linear-gradient(135deg,#db2777,#7c3aed)}
.mode-icon{font-size:48px}
.mode-name{font-size:23px;font-weight:1000}
.mode-desc{opacity:.9;font-size:13px;font-weight:700;margin-top:4px}

/* Game screen */
.game-screen{height:100%;display:flex;flex-direction:column}
.game-top{
  min-height:82px;padding:10px 18px;display:flex;align-items:center;
  justify-content:space-between;gap:12px;color:white;
  background:linear-gradient(90deg,#312e81,#4f46e5,#0891b2);
}
.game-brand{font-size:22px;font-weight:1000;white-space:nowrap}
.game-progress{flex:1;max-width:500px}
.progress-label{display:flex;justify-content:space-between;font-size:12px;font-weight:900}
.progress-track{height:11px;background:#ffffff35;border-radius:99px;overflow:hidden;margin-top:4px}
.progress-fill{height:100%;background:linear-gradient(90deg,#fbbf24,#f97316);border-radius:99px}
.game-body{
  flex:1;min-height:0;padding:16px;
  display:grid;grid-template-columns:minmax(0,1.12fr) minmax(360px,.88fr);
  gap:16px;
}
.question-panel,.camera-panel{
  min-height:0;border-radius:28px;background:#ffffffef;
  box-shadow:0 15px 35px #11182735;
}
.question-panel{padding:22px;display:flex;flex-direction:column}
.question-chip{
  display:inline-flex;align-items:center;gap:7px;width:max-content;
  padding:7px 12px;border-radius:999px;background:#ede9fe;color:#5b21b6;
  font-size:12px;font-weight:1000;
}
.question-title{
  font-size:clamp(22px,2.5vw,35px);font-weight:1000;line-height:1.12;
  margin:12px 0 8px;color:#172554;
}
.question-help{font-weight:800;color:#6366f1;font-size:14px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.ans{
  border:3px solid #e0e7ff!important;
  border-radius:20px!important;
  background:linear-gradient(135deg,#fff,#f8fafc)!important;
  padding:14px!important;min-height:72px;
  color:#172554!important;font-size:16px!important;
  transition:.16s!important;
}
.ans:hover{transform:translateY(-3px)!important;border-color:#818cf8!important}
.ans.selected{outline:4px solid #60a5fa!important;background:#dbeafe!important}
.ans.correct{outline:4px solid #22c55e!important;background:#dcfce7!important}
.ans.wrong{outline:4px solid #ef4444!important;background:#fee2e2!important}
.answer-letter{
  width:38px;height:38px;flex:none;border-radius:13px;display:grid;place-items:center;
  background:#e0e7ff;color:#3730a3;font-weight:1000;
}
.submit-btn{
  border:0;border-radius:18px!important;margin-top:13px;padding:14px;
  background:linear-gradient(90deg,#4f46e5,#7c3aed)!important;
  font-size:16px;font-weight:1000;color:white;cursor:pointer;
}
.submit-btn:disabled{opacity:.4;cursor:not-allowed}
.tip{
  margin-top:auto;padding:12px 14px;border-radius:16px;
  background:#ecfeff;color:#155e75;font-size:12px;font-weight:800;
}

/* Camera */
.camera-panel{padding:10px;background:#111827;color:white}
#camwrap{
  position:relative;overflow:hidden;border-radius:22px;background:#020617;
  width:100%;height:100%;min-height:380px;aspect-ratio:auto;
}
#cam{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#cameraQuiz{
  position:absolute;inset:0;padding:14px;
  display:flex;flex-direction:column;justify-content:space-between;
  z-index:5;pointer-events:none;
}
#cameraQuestion{
  background:#111827dd;color:white;border:2px solid #ffffff35;
  border-radius:18px;padding:13px;backdrop-filter:blur(8px);
  box-shadow:0 8px 25px #0008;pointer-events:auto;
}
#cameraAnswers{display:grid;grid-template-columns:1fr 1fr;gap:9px;pointer-events:auto}
.cameraAns{
  color:#172554;background:#fffffff5;border:3px solid #ffffffaa;
  border-radius:15px;padding:11px;text-align:left;font-weight:900;
  box-shadow:0 7px 18px #0006;min-height:55px;cursor:pointer;transition:.15s;
}
.cameraAns:hover,.cameraAns:focus{transform:translateY(-2px);background:white}
.cameraAns.selected{outline:4px solid #60a5fa;background:#dbeafe}
.cameraAns.correct{outline:4px solid #4ade80;background:#dcfce7}
.cameraAns.wrong{outline:4px solid #f87171;background:#fee2e2}
.cameraLetter{
  display:inline-flex;width:29px;height:29px;border-radius:10px;
  background:#e0e7ff;color:#3730a3;align-items:center;justify-content:center;margin-right:6px;
}
#cameraHint{
  font-size:11px;color:#fff;background:#0f172acc;border-radius:999px;
  padding:6px 10px;text-align:center;align-self:center;backdrop-filter:blur(5px)
}
#pointer{
  position:absolute;width:32px;height:32px;border:4px solid white;border-radius:50%;
  background:#3b82f6aa;box-shadow:0 0 0 7px #60a5fa44;
  display:none;transform:translate(-50%,-50%);pointer-events:none;z-index:20
}
#hold{
  position:absolute;left:8%;right:8%;bottom:12px;height:9px;
  background:#ffffff44;border-radius:9px;display:none;overflow:hidden;z-index:21
}
#fill{height:100%;width:0;background:#22c55e}

/* Feedback/victory */
.feedback{
  position:fixed;left:50%;bottom:20px;transform:translateX(-50%);
  width:min(680px,92vw);z-index:50;padding:18px;border-radius:22px;
  background:#fffffffa;box-shadow:0 20px 50px #11182755;text-align:center;
}
.victory-screen{
  width:100%;height:100%;display:grid;place-items:center;padding:25px;
}
.victory-card{
  width:min(850px,94vw);text-align:center;padding:40px;border-radius:35px;
  background:#ffffffef;box-shadow:0 25px 60px #11182755;
}
.victory-card h1{font-size:clamp(40px,6vw,68px);font-weight:1000;color:#4f46e5}
.victory-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:25px}
.v-stat{padding:18px;border-radius:20px;background:#f8fafc}
.v-stat b{font-size:35px}
.main-btn{
  border:0;border-radius:18px;padding:14px 30px;background:#4f46e5;color:white;
  font-weight:1000;cursor:pointer;margin-top:20px;
}
@media(max-width:850px){
  html,body{overflow:auto}
  .game-screen{min-height:100vh;height:auto}
  .game-body{grid-template-columns:1fr;padding:10px}
  .question-panel{min-height:auto}
  .camera-panel{min-height:430px}
  .game-top{flex-wrap:wrap}
  .game-progress{order:3;flex-basis:100%;max-width:none}
}
@media(max-width:600px){
  .mode-grid,.answers,.victory-stats{grid-template-columns:1fr}
  .tv-header{height:auto;align-items:flex-start}
  .tv-stats{display:none}
  .home-card{padding:24px}
  .game-body{padding:8px}
  .camera-panel{min-height:390px}
  #cameraAnswers{grid-template-columns:1fr}
}

.game-error{position:fixed;inset:0;display:grid;place-items:center;padding:25px;background:#312e81;color:white;z-index:9999}
.game-error-box{max-width:600px;background:white;color:#172554;border-radius:25px;padding:30px;text-align:center;box-shadow:0 20px 60px #0006}
</style></head>
<body class="text-slate-800"><div class="max-w-5xl mx-auto p-4 md:p-7"><header class="glass rounded-3xl p-5 mb-5 flex justify-between items-center gap-3"><div><b class="text-3xl text-indigo-700">🎯 MORAL QUEST</b><div class="font-semibold text-slate-500">Misi Kejujuran — Camera Quest</div></div><div class="flex gap-2 text-sm font-bold"><span class="bg-indigo-100 px-3 py-2 rounded-full">⭐ <b id="score">0</b></span><span class="bg-amber-100 px-3 py-2 rounded-full">🔥 <b id="combo">0</b></span><span class="bg-emerald-100 px-3 py-2 rounded-full">⚡ <b id="energy">100</b></span></div></header><main id="app"></main></div>
<script>
const Q=[
["Kamu ternampak wang tercicir di dalam kelas. Apakah tindakan yang jujur?",["Ambil dan simpan.","Serahkan kepada guru.","Biarkan sahaja.","Suruh kawan ambil."],[1],"Kejujuran bermaksud melakukan perkara yang benar walaupun tiada orang melihat."],
["Kamu terlupa menyiapkan kerja rumah. Apakah yang patut dilakukan?",["Menipu bahawa buku tertinggal.","Salin kerja kawan.","Beritahu guru dengan jujur.","Sembunyikan buku."],[2],"Mengakui kesilapan ialah tindakan jujur dan bertanggungjawab."],
["Kamu memecahkan pasu secara tidak sengaja. Apakah tindakan yang betul?",["Sembunyikan.","Salahkan adik.","Mengaku kepada ibu bapa.","Buat-buat tidak tahu."],[2],"Bercakap benar membantu masalah diselesaikan dengan baik."],
["Pilih SEMUA tindakan yang menunjukkan kejujuran.",["Pulangkan barang bukan milik kita.","Mengaku apabila melakukan kesalahan.","Menipu untuk mendapat hadiah.","Bercakap benar kepada guru."],[0,1,3],"Kejujuran termasuk bercakap benar, mengakui kesalahan dan menghormati hak orang lain."],
["Kawan mengajak kamu meniru jawapan. Apakah pilihan yang jujur?",["Beri jawapan.","Tolak dengan baik.","Tiru jawapan.","Tukar kertas."],[1],"Menolak perbuatan meniru menunjukkan integriti."],
["Apakah perasaan apabila kita bercakap benar?",["Tenang dan lega.","Takut kerana berbohong.","Marah.","Malu kerana menipu."],[0],"Bercakap benar boleh membuatkan kita berasa tenang dan lega."],
["Pilih SEMUA kepentingan bersikap jujur.",["Dipercayai orang lain.","Mewujudkan hubungan baik.","Menyebabkan orang takut.","Membina sikap bertanggungjawab."],[0,1,3],"Kejujuran membina kepercayaan, hubungan baik dan tanggungjawab."]
];
let n=0,score=0,combo=0,energy=100,mode="touch",picked=[],locked=false,stream=null,hands=null,face=null,running=false,hold=-1,started=0;
const app=document.getElementById("app");
function home(){stop();app.innerHTML=`<div class="home-screen">
<header class="tv-header">
  <div class="tv-brand"><div class="tv-logo">🎯</div><div><div class="tv-title">MORAL QUEST</div><div class="tv-sub">MISI KEJUJURAN • PENDIDIKAN MORAL TAHUN 5</div></div></div>
  <div class="tv-stats"><span class="tv-stat">⭐ 0 Mata</span><span class="tv-stat">🔥 Cabaran</span></div>
</header>
<main class="home-main">
  <section class="home-card">
    <span class="hero-badge">🌈 JOM MULAKAN PENGEMBARAAN</span>
    <div class="hero-icon">🛡️</div>
    <h1 class="hero-title">MISI KEJUJURAN</h1>
    <p class="hero-sub">Terokai cabaran, pilih tindakan yang betul dan buktikan bahawa kamu seorang yang jujur!</p>
    <div class="mode-grid">
      <button onclick="start('touch')" class="mode-btn mode-touch">
        <div class="mode-icon">👆</div><div class="mode-name">MOD SENTUH</div>
        <div class="mode-desc">Klik atau sentuh jawapan pada skrin.</div>
      </button>
      <button onclick="start('camera')" class="mode-btn mode-camera">
        <div class="mode-icon">📷✋</div><div class="mode-name">CAMERA QUEST</div>
        <div class="mode-desc">Gunakan jari telunjuk untuk memilih jawapan.</div>
      </button>
    </div>
  </section>
</main></div>`}
function start(m){mode=m;n=0;score=0;combo=0;energy=100;show()}
function show(){
picked=[];locked=false;stop();let q=Q[n],multi=q[2].length>1;
app.innerHTML=`<div class="game-screen">
<header class="game-top">
  <div class="game-brand">🎯 MORAL QUEST</div>
  <div class="game-progress">
    <div class="progress-label"><span>🚀 MISI ${n+1} DARIPADA 7</span><span>${Math.round((n+1)/7*100)}%</span></div>
    <div class="progress-track"><div class="progress-fill" style="width:${(n+1)/7*100}%"></div></div>
  </div>
  <div class="tv-stats"><span class="tv-stat">⭐ <b id="score">0</b></span><span class="tv-stat">🔥 <b id="combo">0</b></span><span class="tv-stat">⚡ <b id="energy">100</b></span></div>
</header>
<main class="game-body">
<section class="question-panel">
  <span class="question-chip">🧭 CABARAN KEJUJURAN</span>
  <h1 class="question-title">${q[0]}</h1>
  <div class="question-help">${multi?"☑️ Pilih semua jawapan yang betul.":"👉 Pilih satu jawapan yang paling tepat."}</div>
  <div id="answers" class="answers">${q[1].map((x,j)=>`<button class="ans" data-i="${j}" onclick="pick(${j})"><span class="answer-letter">${String.fromCharCode(65+j)}</span><span>${x}</span></button>`).join("")}</div>
  <button id="submit" disabled onclick="submit()" class="submit-btn">${multi?"SAHKAN JAWAPAN":"PILIH JAWAPAN"}</button>
  <div class="tip">💡 Tip: Kejujuran bermaksud melakukan perkara yang benar walaupun tiada orang melihat.</div>
</section>
${mode==="camera"?`
<section class="camera-panel">
<div id="camwrap">
<video id="cam" autoplay playsinline muted></video>
<canvas id="overlay"></canvas>
<div id="cameraQuiz">
<div id="cameraQuestion"><div class="text-xs font-black text-indigo-200 mb-1">SOALAN ${n+1} / 7</div><h2 class="font-black leading-tight">${q[0]}</h2><div class="text-[11px] text-indigo-100 font-bold mt-2">${multi?"Pilih SEMUA jawapan yang betul":"Pilih SATU jawapan yang paling tepat"}</div></div>
<div id="cameraAnswers">${q[1].map((x,j)=>`<button class="cameraAns" data-i="${j}" onclick="pick(${j})"><span class="cameraLetter">${String.fromCharCode(65+j)}</span>${x}</button>`).join("")}</div>
<div id="cameraHint">☝️ Tunjuk jari telunjuk atau sentuh jawapan</div>
</div><div id="pointer"></div><div id="hold"><div id="fill"></div></div>
</div>
<div class="flex justify-between p-3 text-sm"><span id="faceStatus">🔎 Mencari wajah...</span><button onclick="mode='touch';show()" class="bg-white/15 px-3 py-2 rounded-xl">Mod Sentuh</button></div>
</section>`:`<section class="camera-panel" style="display:grid;place-items:center;background:linear-gradient(135deg,#312e81,#4f46e5,#0891b2);"><div style="text-align:center;color:white;padding:30px"><div style="font-size:90px">🎮</div><h2 style="font-size:30px;font-weight:1000">MOD SENTUH</h2><p style="font-weight:700;opacity:.9">Pilih jawapan di sebelah untuk meneruskan misi.</p></div></section>`}
</main></div>`;
if(mode==="camera")camera()
}
function pick(j){
if(locked)return;
let multi=Q[n][2].length>1;
if(multi){
picked.includes(j)?picked=picked.filter(x=>x!==j):picked.push(j);
document.querySelectorAll(".ans,.cameraAns").forEach((b)=>{
let k=+b.dataset.i;b.classList.toggle("selected",picked.includes(k))
});
document.getElementById("submit").disabled=!picked.length
}else{
picked=[j];
document.querySelectorAll(".ans,.cameraAns").forEach((b)=>{
let k=+b.dataset.i;b.classList.toggle("selected",k===j)
});
document.getElementById("submit").disabled=false;
setTimeout(submit,150)
}
}
function submit(){if(locked||!picked.length)return;locked=true;stop();let a=[...picked].sort().join(","),b=[...Q[n][2]].sort().join(","),ok=a===b;if(ok){score+=100+combo*20;combo++;energy=Math.min(100,energy+5)}else{combo=0;energy=Math.max(0,energy-15)}document.getElementById("score").textContent=score;document.getElementById("combo").textContent=combo;document.getElementById("energy").textContent=energy;document.querySelectorAll(".ans,.cameraAns").forEach((x,k)=>{if(Q[n][2].includes(k))x.classList.add("correct");if(picked.includes(k)&&!Q[n][2].includes(k))x.classList.add("wrong")});app.insertAdjacentHTML("beforeend",`<div class="feedback"><div style="font-size:45px">${ok?"🎉":"💡"}</div><h3 style="font-size:24px;font-weight:1000;margin:4px 0">${ok?"Betul!":"Mari belajar bersama!"}</h3><p style="margin:5px 0">${Q[n][3]}</p><button onclick="next()" class="main-btn">${n===6?"LIHAT KEJAYAAN":"MISI SETERUSNYA →"}</button></div>`)}
function next(){n++;n>=7?victory():show()}
function victory(){stop();app.innerHTML=`<div class="victory-screen"><section class="victory-card"><div style="font-size:100px">🏆</div><h1>MISI SELESAI!</h1><p style="font-size:20px;font-weight:700;color:#64748b">Tahniah! Kamu telah menyelesaikan semua cabaran kejujuran.</p><div class="victory-stats"><div class="v-stat"><b>${score}</b><p>Mata</p></div><div class="v-stat"><b>${combo}</b><p>Combo</p></div><div class="v-stat"><b>${energy}</b><p>Tenaga</p></div></div><div style="background:#eef2ff;border-radius:20px;padding:18px;margin-top:18px"><b>❤️ Refleksi</b><p>Saya akan mengamalkan kejujuran walaupun tiada orang melihat.</p></div><button onclick="start(mode)" class="main-btn">MAIN SEMULA</button></section></div>`}
async function camera(){try{
if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error("Kamera tidak disokong");
if(typeof Hands==="undefined"||typeof FaceMesh==="undefined")throw new Error("Komponen kamera belum dimuat");
stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:960},height:{ideal:600}},audio:false});let v=document.getElementById("cam");v.srcObject=stream;await v.play();hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});hands.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:.6,minTrackingConfidence:.6});hands.onResults(hand);face=new FaceMesh({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`});face.setOptions({maxNumFaces:1,minDetectionConfidence:.55,minTrackingConfidence:.55});face.onResults(fr=>{let s=document.getElementById("faceStatus");if(s)s.textContent=fr.multiFaceLandmarks?.length?"🙂 Wajah dikesan":"🔎 Mencari wajah..."});running=true;loop()}catch(e){
let s=document.getElementById("faceStatus");if(s)s.textContent="⚠️ Kamera tidak tersedia. Kamu masih boleh gunakan jawapan sentuh.";
let panel=document.querySelector(".camera-panel");
if(panel){let note=document.createElement("div");note.style.cssText="position:absolute;left:18px;right:18px;bottom:18px;background:#fff;color:#172554;padding:12px;border-radius:14px;text-align:center;font-weight:800;z-index:40";note.textContent="Gunakan Mod Sentuh untuk meneruskan permainan.";panel.style.position="relative";panel.appendChild(note);}

async function loop(){if(!running)return;let v=document.getElementById("cam");try{await hands.send({image:v});await face.send({image:v})}catch(e){}requestAnimationFrame(loop)}
function hand(r){let p=document.getElementById("pointer"),bar=document.getElementById("hold"),fill=document.getElementById("fill");if(!p)return;if(!r.multiHandLandmarks?.length){p.style.display="none";bar.style.display="none";hold=-1;return}let t=r.multiHandLandmarks[0][8],x=1-t.x,y=t.y;p.style.display="block";p.style.left=x*100+"%";p.style.top=y*100+"%";let wrap=document.getElementById("camwrap").getBoundingClientRect(),sx=wrap.left+x*wrap.width,sy=wrap.top+y*wrap.height;let e=document.elementFromPoint(sx,sy),b=e?.closest(".cameraAns,.ans"),idx=b?+b.dataset.i:-1;if(idx<0){hold=-1;bar.style.display="none";return}b.classList.add("selected");if(hold!==idx){hold=idx;started=performance.now()}bar.style.display="block";let pct=Math.min(100,(performance.now()-started)/900*100);fill.style.width=pct+"%";if(pct>=100){pick(idx);hold=-1;bar.style.display="none"}}
function stop(){running=false;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}if(hands){hands.close?.();hands=null}if(face){face.close?.();face=null}}
window.addEventListener("error",function(ev){
  console.error(ev.error||ev.message);
  if(!document.getElementById("app")) return;
  if(!document.querySelector(".home-screen")&&!document.querySelector(".game-screen")&&!document.querySelector(".victory-screen")){
    document.getElementById("app").innerHTML='<div class="game-error"><div class="game-error-box"><div style="font-size:60px">🛠️</div><h2>Permainan mengalami masalah</h2><p>Sila tekan butang di bawah untuk kembali ke menu.</p><button class="main-btn" onclick="location.reload()">↻ CUBA SEMULA</button></div></div>';
  }
});
